plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// MaLiLib（Masa 的库，masa 系列模组的标配）
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	// 客户端 + 服务端：服务端负责权威拾取，客户端负责界面与热键
	accessWidenerPath = file('src/main/resources/picktweak.accesswidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MaLiLib：配置面板 / 热键 / 配置界面注册（客户端可选，服务端不需要）
	implementation "maven.modrinth:malilib:${project.malilib_version}"

	// Mod Menu：可选依赖，只用于提供「配置」按钮（没装时 Fabric 不会加载该入口）
	compileOnly "maven.modrinth:modmenu:${project.mod_menu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// 冒烟测试：不启动游戏，直接跑纯逻辑
tasks.register('smoke', JavaExec) {
	group = 'verification'
	description = 'Runs the Pick Tweak smoke tests against the real Minecraft jar.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'fi.dy.masa.picktweak.smoke.SmokeTest'
}

tasks.named('test') {
	// 冒烟测试是 main 方法而不是 JUnit 用例，没有发现测试时不算失败
	failOnNoDiscoveredTests = false
}
